<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size:30px; font-weight:700; fill:#1a1a1a; }
      .sub   { font-size:16px; fill:#555; }
      .band  { font-size:16px; font-weight:700; letter-spacing:1px; }
      .bandsub { font-size:14px; fill:#555; }
      .h     { font-size:18px; font-weight:700; fill:#1a1a1a; }
      .t     { font-size:14px; fill:#333; }
      .m     { font-family:"DejaVu Sans Mono",monospace; font-size:13px; fill:#333; }
      .lbl   { font-size:12.5px; font-weight:700; }
      .cap   { font-size:14px; fill:#555; font-style:italic; }
      .pill  { font-size:12px; font-weight:700; }
    </style>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2457c5"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
    <marker id="agr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1400" height="1020" fill="#ffffff"/>

  <text x="40" y="48" class="title">voltage-toolkit</text>
  <text x="40" y="72" class="sub">Tokenization monitoring, configuration drift control, and data coverage for OpenText Voltage SecureData — and where the answers go.</text>
  <rect x="1230" y="30" width="130" height="26" rx="13" fill="#eef2ff"/>
  <text x="1295" y="48" text-anchor="middle" class="pill" fill="#3b4fc4">Apache-2.0</text>

  <!-- ============================================================ BAND 1: runtime -->
  <rect x="40" y="96" width="1320" height="300" rx="14" fill="#f7f9fc" stroke="#d9e0ea"/>
  <rect x="40" y="96" width="7" height="300" rx="3" fill="#2457c5"/>
  <text x="66" y="124" class="band" fill="#2457c5">RUNTIME MONITORING</text>
  <text x="290" y="124" class="bandsub">a synthetic application that tokenizes something every 30 s, then reads what the policy file says about the crypto</text>

  <!-- exporter -->
  <rect x="66" y="146" width="290" height="220" rx="10" fill="#ffffff" stroke="#2457c5" stroke-width="2"/>
  <text x="211" y="174" text-anchor="middle" class="h">voltage-exporter</text>
  <text x="211" y="192" text-anchor="middle" class="lbl" fill="#2457c5">SYNTHETIC PROBE · READ-ONLY</text>
  <text x="84" y="218" class="t">• clientPolicy.xml: hash, formats, auth</text>
  <text x="84" y="238" class="t">• protect(4111…) → token → access(token)</text>
  <text x="84" y="258" class="t">• determinism · double-protect · isolation</text>
  <text x="84" y="278" class="t">• TLS handshake + certificate expiry</text>
  <text x="84" y="298" class="t">• key servers · key rotation · domain size</text>
  <text x="84" y="318" class="t">• fleet agreement: prod vs DR tokens</text>
  <text x="84" y="338" class="t">• version → vendor support end date</text>
  <text x="211" y="360" text-anchor="middle" class="m">/metrics · JSON events</text>

  <!-- appliance(s) -->
  <rect x="446" y="178" width="230" height="130" rx="10" fill="#eef3ff" stroke="#2457c5" stroke-width="2"/>
  <rect x="452" y="188" width="230" height="130" rx="10" fill="#ffffff" stroke="#2457c5" stroke-width="2"/>
  <text x="567" y="222" text-anchor="middle" class="h">Voltage SecureData</text>
  <text x="567" y="242" text-anchor="middle" class="t">policy host · Web Services API</text>
  <text x="567" y="260" text-anchor="middle" class="t">key server · TLS certificate</text>
  <text x="567" y="284" text-anchor="middle" class="cap">two regions, one district</text>
  <text x="567" y="302" text-anchor="middle" class="cap">(or the mock, no licence)</text>
  <!-- arrows exporter <-> appliance -->
  <path d="M356 226 H448" stroke="#2457c5" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <path d="M448 272 H364" stroke="#2457c5" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="400" y="214" text-anchor="middle" class="lbl" fill="#2457c5">protect · access</text>
  <text x="398" y="292" text-anchor="middle" class="lbl" fill="#2457c5">policy · keys · TLS</text>

  <!-- prometheus -->
  <rect x="740" y="152" width="190" height="92" rx="10" fill="#ffffff" stroke="#8fa3b8" stroke-width="2"/>
  <text x="835" y="180" text-anchor="middle" class="h">Prometheus</text>
  <text x="835" y="200" text-anchor="middle" class="t">37 alert rules</text>
  <text x="835" y="218" text-anchor="middle" class="t">promtool-tested</text>
  <text x="835" y="236" text-anchor="middle" class="cap">p95 · error ratio · days-left</text>
  <path d="M356 350 H700 V198 H732" stroke="#2457c5" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="700" y="172" text-anchor="middle" class="m">/metrics</text>

  <!-- alertmanager -->
  <rect x="990" y="152" width="170" height="92" rx="10" fill="#ffffff" stroke="#8fa3b8" stroke-width="2"/>
  <text x="1075" y="180" text-anchor="middle" class="h">Alertmanager</text>
  <text x="1075" y="200" text-anchor="middle" class="t">routing · grouping</text>
  <text x="1075" y="218" text-anchor="middle" class="t">inhibition: one page,</text>
  <text x="1075" y="236" text-anchor="middle" class="t">not six</text>
  <path d="M930 198 H982" stroke="#2457c5" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <!-- destinations -->
  <rect x="1210" y="146" width="150" height="34" rx="8" fill="#fff1f0" stroke="#dc4e41" stroke-width="1.5"/>
  <text x="1285" y="168" text-anchor="middle" class="lbl" fill="#b3261e">PagerDuty · pages</text>
  <rect x="1210" y="188" width="150" height="34" rx="8" fill="#eafaf1" stroke="#1e6b45" stroke-width="1.5"/>
  <text x="1285" y="210" text-anchor="middle" class="lbl" fill="#1e6b45">Splunk HEC · audit trail</text>
  <rect x="1210" y="230" width="150" height="34" rx="8" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="1285" y="252" text-anchor="middle" class="lbl" fill="#4b5563">Slack / email · the rest</text>
  <path d="M1160 190 H1202 V163 H1204" stroke="#2457c5" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M1160 200 H1204" stroke="#2457c5" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M1160 210 H1202 V247 H1204" stroke="#2457c5" stroke-width="2" fill="none" marker-end="url(#ab)"/>

  <!-- grafana + splunk app -->
  <rect x="740" y="272" width="190" height="94" rx="10" fill="#ffffff" stroke="#8fa3b8" stroke-width="2"/>
  <text x="835" y="300" text-anchor="middle" class="h">Grafana</text>
  <text x="835" y="320" text-anchor="middle" class="t">"can we tokenize right now?"</text>
  <text x="835" y="338" text-anchor="middle" class="t">latency · crypto · fleet ·</text>
  <text x="835" y="356" text-anchor="middle" class="t">coverage · SDM rows</text>
  <path d="M835 244 V264" stroke="#8fa3b8" stroke-width="2" fill="none" marker-end="url(#agr)"/>

  <rect x="990" y="272" width="370" height="94" rx="10" fill="#ffffff" stroke="#1e6b45" stroke-width="2"/>
  <text x="1175" y="298" text-anchor="middle" class="h">Splunk app</text>
  <text x="1175" y="318" text-anchor="middle" class="t">"when did it start, what changed just before?"</text>
  <text x="1175" y="336" text-anchor="middle" class="t">JSON probe events + every Alertmanager notification</text>
  <text x="1175" y="356" text-anchor="middle" class="cap">transitions · time-to-clear · scheduled searches</text>
  <path d="M700 350 V384 H972 V332 H982" stroke="#1e6b45" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="836" y="380" text-anchor="middle" class="lbl" fill="#1e6b45">JSON log events</text>

  <!-- ============================================================ BAND 2: config -->
  <rect x="40" y="418" width="1320" height="212" rx="14" fill="#faf7fd" stroke="#e3d8f2"/>
  <rect x="40" y="418" width="7" height="212" rx="3" fill="#6d28d9"/>
  <text x="66" y="446" class="band" fill="#6d28d9">CONFIGURATION + DRIFT CONTROL</text>
  <text x="400" y="446" class="bandsub">Git is the rulebook; Ansible compares desired state with live Voltage policy facts, every night</text>

  <rect x="66" y="470" width="190" height="120" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="161" y="500" text-anchor="middle" class="h">Git</text>
  <text x="161" y="524" text-anchor="middle" class="m">voltage-config.yml</text>
  <text x="161" y="544" text-anchor="middle" class="m">voltage-data-map.yml</text>
  <text x="161" y="570" text-anchor="middle" class="cap">versioned rulebook</text>
  <path d="M256 530 H330" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
  <text x="293" y="514" text-anchor="middle" class="lbl" fill="#6d28d9">desired</text>
  <text x="293" y="550" text-anchor="middle" class="lbl" fill="#6d28d9">state</text>

  <rect x="338" y="470" width="400" height="120" rx="10" fill="#f3ebff" stroke="#6d28d9" stroke-width="2"/>
  <text x="538" y="496" text-anchor="middle" class="h">Ansible collection</text>
  <text x="538" y="514" text-anchor="middle" class="m">flavioimbertdomingos.voltage</text>
  <text x="538" y="538" text-anchor="middle" class="t">voltage_district · voltage_identity · voltage_auth_method</text>
  <text x="538" y="556" text-anchor="middle" class="t">voltage_policy_facts · voltage_probe · voltage_coverage</text>
  <text x="538" y="578" text-anchor="middle" class="lbl" fill="#6d28d9">+ roles: voltage_policy_audit · voltage_exporter</text>
  <path d="M738 512 H796" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>
  <text x="767" y="498" text-anchor="middle" class="lbl" fill="#6d28d9">apply</text>
  <path d="M796 548 H746" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <text x="767" y="566" text-anchor="middle" class="lbl" fill="#6b7280">facts</text>

  <rect x="804" y="470" width="240" height="120" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="924" y="500" text-anchor="middle" class="h">Voltage SecureData</text>
  <text x="924" y="524" text-anchor="middle" class="t">districts · identities · auth methods</text>
  <text x="924" y="544" text-anchor="middle" class="t">formats the policy actually offers</text>
  <text x="924" y="570" text-anchor="middle" class="cap">no config API: an adapter contract</text>
  <path d="M1044 530 H1120" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#ap)"/>

  <rect x="1128" y="470" width="232" height="120" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="1244" y="500" text-anchor="middle" class="h">Drift report</text>
  <text x="1244" y="524" text-anchor="middle" class="t">config vs appliance → DRIFT</text>
  <text x="1244" y="544" text-anchor="middle" class="t">unmapped / broken → DRIFT</text>
  <text x="1244" y="570" text-anchor="middle" class="cap">audit evidence, fails the pipeline</text>

  <!-- ============================================================ BAND 3: data -->
  <rect x="40" y="652" width="1320" height="292" rx="14" fill="#f4fbf9" stroke="#cfe8e2"/>
  <rect x="40" y="652" width="7" height="292" rx="3" fill="#0f766e"/>
  <text x="66" y="680" class="band" fill="#0f766e">DATA: IS EVERYTHING THAT SHOULD BE PROTECTED, PROTECTED?</text>
  <text x="66" y="700" class="bandsub">the join nobody owns: discovery says where the PANs are, the policy says what can be protected, the data map says what is</text>

  <rect x="66" y="722" width="240" height="90" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="186" y="750" text-anchor="middle" class="h">Classification feed</text>
  <text x="186" y="770" text-anchor="middle" class="t">CSV from Structured Data Manager,</text>
  <text x="186" y="788" text-anchor="middle" class="t">Core Data Discovery, a spreadsheet</text>
  <text x="186" y="806" text-anchor="middle" class="m">system,table,column,class</text>

  <rect x="66" y="830" width="240" height="90" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="186" y="858" text-anchor="middle" class="h">Masked non-prod data</text>
  <text x="186" y="878" text-anchor="middle" class="t">SQL (any DB-API driver) or CSV,</text>
  <text x="186" y="896" text-anchor="middle" class="t">read-only, plus the job history</text>
  <text x="186" y="914" text-anchor="middle" class="cap">planted canaries, not Luhn</text>

  <path d="M306 767 H336" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M306 875 H336" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>

  <rect x="344" y="722" width="380" height="90" rx="10" fill="#e6f5f1" stroke="#0f766e" stroke-width="2"/>
  <text x="534" y="750" text-anchor="middle" class="h">Coverage join</text>
  <text x="534" y="770" text-anchor="middle" class="t">feed × data map × live policy (× identities)</text>
  <text x="534" y="788" text-anchor="middle" class="t">every column: protected · unmapped · broken · unknown</text>
  <text x="534" y="806" text-anchor="middle" class="t">and the other way: dead formats still rotating keys</text>

  <rect x="344" y="830" width="380" height="90" rx="10" fill="#e6f5f1" stroke="#0f766e" stroke-width="2"/>
  <text x="534" y="858" text-anchor="middle" class="h">SDM checks</text>
  <text x="534" y="878" text-anchor="middle" class="t">leak (canary in the masked copy) · consistency · constant</text>
  <text x="534" y="896" text-anchor="middle" class="t">jobs: stale · failing · hours since last success</text>
  <text x="534" y="914" text-anchor="middle" class="cap">did masking actually mask, and did the job run?</text>

  <path d="M724 767 H754" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
  <path d="M724 875 H754" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>

  <rect x="762" y="722" width="598" height="198" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1061" y="750" text-anchor="middle" class="h">Runs inside the exporter, and inside the audit role</text>
  <text x="1061" y="772" text-anchor="middle" class="t">Same stdlib code, byte-identical in two homes; CI diffs them on every push.</text>
  <text x="1061" y="796" text-anchor="middle" class="m" font-size="12px">voltage_coverage_columns{state} · voltage_coverage_dead_format · voltage_coverage_up</text>
  <text x="1061" y="814" text-anchor="middle" class="m" font-size="12px">voltage_sdm_mask_ok{kind} · voltage_sdm_mask_hits · voltage_sdm_job_stale · voltage_sdm_job_failing</text>
  <text x="1061" y="840" text-anchor="middle" class="t" font-size="13px">VoltageUnprotectedSensitiveColumn · VoltageBrokenProtectionMapping · VoltageDeadFormat</text>
  <text x="1061" y="858" text-anchor="middle" class="t" font-size="13px">SDMMaskLeak (pages) · SDMMaskInconsistent · SDMMaskConstant · SDMJobStale · SDMJobFailing</text>
  <text x="1061" y="886" text-anchor="middle" class="cap">PCI scope drift shows up in Prometheus this week, not in next year's ROC.</text>
  <text x="1061" y="906" text-anchor="middle" class="cap">Non-prod holding production data shows up before it is handed to developers.</text>

  <!-- footer -->
  <text x="700" y="978" text-anchor="middle" class="cap">docker compose up → two mock appliances + exporter + Prometheus + Alertmanager + Grafana + mock PagerDuty / Splunk + a seeded masked database. No licence needed. Break it on purpose with /mock/scenario/…</text>
  <text x="700" y="1002" text-anchor="middle" class="t" font-weight="700">Detect slow, wrong, broken, drifted, or unprotected — before customers, auditors, or developers notice.</text>
</svg>
