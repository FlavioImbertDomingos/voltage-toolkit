# Alerts for Voltage SecureData, fed by voltage-exporter's synthetic probes.
#
# The probes answer one question a dashboard of appliance CPU never can:
# "can an application tokenize a card number right now, and how long does it take?"

groups:
  - name: voltage-recording
    interval: 15s
    rules:
      - record: voltage:tokenize_error_ratio_10m
        # "or 0 * total" keeps the ratio at 0 (not absent) for targets that have never failed
        expr: |
          (
            sum by (target, format) (rate(voltage_tokenize_probes_total{result="failure"}[10m]))
              or 0 * sum by (target, format) (rate(voltage_tokenize_probes_total[10m]))
          )
            /
          sum by (target, format) (rate(voltage_tokenize_probes_total[10m]) > 0)
      - record: voltage:protect_p95_seconds_10m
        expr: histogram_quantile(0.95, sum by (target, format, le) (rate(voltage_protect_seconds_bucket[10m])))
      - record: voltage:access_p95_seconds_10m
        expr: histogram_quantile(0.95, sum by (target, format, le) (rate(voltage_access_seconds_bucket[10m])))
      - record: voltage:certificate_days_until_expiry
        expr: (voltage_certificate_expiry_timestamp_seconds - time()) / 86400
      - record: voltage:support_days_remaining
        expr: (voltage_support_end_timestamp_seconds - time()) / 86400
      - record: voltage:coverage_feed_age_days
        expr: (time() - voltage_coverage_feed_mtime_seconds) / 86400
      - record: voltage:sdm_job_hours_since_success
        expr: (time() - voltage_sdm_job_last_success_timestamp_seconds) / 3600
      - record: voltage:restore_drill_days_since_success
        expr: (time() - voltage_identity_backup_restore_tested_timestamp_seconds) / 86400

  - name: voltage-availability
    rules:
      - alert: VoltageExporterDown
        expr: up{job="voltage-exporter"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "voltage-exporter is not being scraped"
          description: "No Voltage probes are running. Check the exporter container/service."

      - alert: VoltageProbesStale
        expr: time() - voltage_probe_last_run_timestamp_seconds > 300
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Probes for {{ $labels.target }} have not completed in 5 minutes"
          description: "The probe loop is stuck or every call is timing out. Check exporter logs."

      - alert: VoltagePolicyUnreachable
        expr: voltage_policy_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "clientPolicy.xml unreachable on {{ $labels.target }}"
          description: "Every SecureData client downloads the policy at startup. New app instances, pods and batch jobs cannot start tokenizing until this is fixed."

      - alert: VoltageKeyServerDown
        expr: voltage_keyserver_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Key server {{ $labels.url }} down ({{ $labels.target }})"
          description: "Clients with cached keys keep working; anything needing a new key (new identity, key rotation, cold start) fails."

      - alert: VoltageConsoleUnreachable
        expr: voltage_console_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Management Console unreachable on {{ $labels.target }} (protection unaffected)"
          description: "Control plane only: tokenization keeps working, key servers keep serving. Only one console instance is active per deployment, so while it is down no policy change, new identity or audit review is possible. Do not page for this; do fix it before the next change window."

  - name: voltage-tokenization
    rules:
      - alert: VoltageTokenizationFailing
        expr: voltage_tokenize_success == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Tokenization broken: {{ $labels.format }} on {{ $labels.target }}"
          description: "protect+access round-trip for format {{ $labels.format }} (identity {{ $labels.identity }}) has failed for 2 minutes. See voltage_tokenize_errors_total for the kind (auth / http / timeout / connection / mismatch)."

      - alert: VoltageAuthFailures
        expr: increase(voltage_tokenize_errors_total{kind="auth"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Authentication failures on {{ $labels.target }} ({{ $labels.format }})"
          description: "The probe identity's shared secret / password is being rejected. Was a credential rotated? Was LDAP touched?"

      - alert: VoltageRoundTripMismatch
        expr: voltage_tokenize_roundtrip_ok == 0
        labels: {severity: critical}
        annotations:
          summary: "DATA INTEGRITY: access(protect(x)) != x on {{ $labels.target }} ({{ $labels.format }})"
          description: "Detokenizing returned a different value than was tokenized. Stop and investigate key/district configuration before anything writes tokens to a database."

      # --- the silent ones: HTTP 200, plausible data, wrong (roadmap R3)
      - alert: VoltageFormatIsolationBroken
        expr: voltage_integrity_ok{check="format_isolation"} == 0
        labels: {severity: critical}
        annotations:
          summary: "DATA EXPOSURE: a {{ $labels.format }} token detokenizes under format {{ $labels.against }} ({{ $labels.target }})"
          description: "access() under the wrong format returned the original plaintext. Formats are supposed to be separate key spaces; this means two formats share a key, or an identity is over-authorized. Any application allowed to use {{ $labels.against }} can read {{ $labels.format }} data. Treat as an incident."

      - alert: VoltageNonDeterministic
        expr: voltage_integrity_ok{check="determinism"} == 0
        labels: {severity: critical}
        annotations:
          summary: "REFERENTIAL INTEGRITY: {{ $labels.format }} protects the same value differently each time ({{ $labels.target }})"
          description: "protect(x) != protect(x). Joins across tables on this column silently drop rows and lookups by protected value miss. Round-trip probes still pass, so nothing else will alert. Causes: a rotation in progress without eFPE, per-call tweaks, or a client library bug. (eFPE formats are excluded from this check on purpose.)"

      - alert: VoltageDoubleProtectCorrupts
        expr: voltage_integrity_ok{check="double_protect"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.format }} on {{ $labels.target }}: protecting an already-protected value is not reversible"
          description: "access(protect(protect(x))) != protect(x). An ETL step that protects a column twice -- which happens -- would corrupt it without any error. Check format definition (checksum / preserved-character rules) and client library version."

      - alert: VoltageErrorRateHigh
        expr: voltage:tokenize_error_ratio_10m > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.target }} {{ $labels.format }}: {{ $value | humanizePercentage }} of probes failing"
          description: "Intermittent failures over 10 minutes. Applications are seeing the same."

      - alert: VoltageLatencyHigh
        expr: voltage:protect_p95_seconds_10m > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.target }} {{ $labels.format }}: p95 protect latency {{ $value | humanizeDuration }}"
          description: "Tokenization is slow. Check appliance load, key server, network path, and whether a key rotation is in progress."

      - alert: VoltageFormatNotPreserved
        expr: voltage_tokenize_format_preserved == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.format }} on {{ $labels.target }} returned a token with a different shape"
          description: "FPE must keep length and character classes. A different shape breaks downstream schema validation."

  - name: voltage-configuration
    rules:
      - alert: VoltagePolicyChanged
        expr: increase(voltage_policy_changes_total[30m]) > 0
        labels: {severity: info}
        annotations:
          summary: "clientPolicy.xml changed on {{ $labels.target }}"
          description: "Formats, key servers or auth methods changed. Expected after a change window; otherwise investigate (PCI DSS 12.3.3 / change control)."

      - alert: VoltageCertificateExpiringSoon
        expr: voltage:certificate_days_until_expiry < 30 and voltage:certificate_days_until_expiry >= 7
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.host }} certificate expires in {{ $value | printf \"%.0f\" }} days"
          description: "Subject {{ $labels.subject }} ({{ $labels.target }}). Every SecureData client validates this certificate."

      - alert: VoltageCertificateExpiringCritical
        expr: voltage:certificate_days_until_expiry < 7
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.host }} certificate expires in {{ $value | printf \"%.1f\" }} days"
          description: "Subject {{ $labels.subject }} ({{ $labels.target }}). When it expires, every client's TLS validation fails and tokenization stops."

      - alert: VoltageTlsHandshakeFailing
        expr: voltage_tls_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Cannot complete a TLS handshake with {{ $labels.host }} ({{ $labels.target }})"
          description: "Host down, port filtered, or a certificate/cipher problem."

  # What the policy file says about the cryptography itself. All of these come from
  # clientPolicy.xml alone -- no protect/access calls -- so they work with a read-only,
  # unauthenticated probe.
  - name: voltage-crypto-policy
    rules:
      - alert: VoltageKeyRotated
        expr: increase(voltage_key_rotations_total[30m]) > 0
        labels: {severity: info}
        annotations:
          summary: "Key table {{ $labels.table }} rotated on {{ $labels.target }}"
          description: "currentNumber changed (now {{ with printf `voltage_key_table_current_number{target=\"%s\",table=\"%s\"}` $labels.target $labels.table | query }}{{ . | first | value }}{{ end }}). Expected inside a crypto-period change window; otherwise investigate. Old key numbers stay listed so existing ciphertext still decrypts -- but eFPE columns will now hold two ciphertext epochs."

      - alert: VoltageWeakCurrentKey
        expr: voltage_key_current_size_bits > 0 and voltage_key_current_size_bits < 256
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Key table {{ $labels.table }} on {{ $labels.target }} is using a {{ $value }}-bit key"
          description: "The current key is below AES-256. OpenText's own post-quantum position rests on 256-bit symmetric keys (128-bit security under Grover); a 128-bit key does not get that argument. Rotate to a 256-bit key number."

      - alert: VoltageFormatBelowMinimumDomain
        expr: voltage_format_below_minimum_domain == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "FPE format {{ $labels.format }} on {{ $labels.target }} has a domain under 10^6"
          description: "Estimated domain {{ with printf `voltage_format_domain_size{target=\"%s\",format=\"%s\"}` $labels.target $labels.format | query }}{{ . | first | value | humanize }}{{ end }} (radix ** encrypted positions). NIST SP 800-38G Rev. 1 makes a minimum of one million a requirement for FF1 -- small domains are attackable regardless of mode. Typical culprits: CVV, last-4-preserving SSN, state codes, short IDs. Use SST, FPH, or a schema change with AES instead."

      - alert: VoltageVersionApproachingEndOfSupport
        expr: voltage:support_days_remaining < 180 and voltage:support_days_remaining >= 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.target }} runs {{ $labels.version }}: vendor maintenance ends in {{ $value | printf \"%.0f\" }} days"
          description: "{{ $labels.release }} leaves maintenance soon. Plan the upgrade -- and test the identity/master-secret restore first, the upgrade path depends on a database backup that has a documented failure mode."

      - alert: VoltageVersionOutOfSupport
        expr: voltage:support_days_remaining < 0
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.target }} runs {{ $labels.version }}, out of vendor maintenance"
          description: "{{ $labels.release }} maintenance ended {{ with printf `-voltage:support_days_remaining{target=\"%s\",version=\"%s\"}` $labels.target $labels.version | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }} days ago. No security fixes; a PCI DSS 6.3.3 finding waiting to happen."

  # Several vantage points on the same district must give the same answers (R4, R15).
  # Targets opt in with `fleet: <name>` in the exporter config.
  - name: voltage-fleet
    rules:
      - alert: VoltageRegionDivergence
        expr: voltage_fleet_agreement{check="token"} == 0
        labels: {severity: critical}
        annotations:
          summary: "DR DIVERGENCE: fleet {{ $labels.fleet }} protects {{ $labels.key }} differently on {{ with printf `voltage_fleet_member_diverged{fleet=\"%s\",check=\"token\",key=\"%s\"} == 1` $labels.fleet $labels.key | query }}{{ range . }}{{ .Labels.target }} {{ end }}{{ end }}"
          description: "The same synthetic value protects to different tokens on different members of the fleet. Same policy, same formats, different master secret or token tables -- a region built from its own district rather than restored from the shared backup. Every member round-trips fine on its own, so nothing else alerts. If this fleet fails over, it will write tokens the other side cannot detokenize. Do not fail over until fixed."

      - alert: VoltagePolicyFleetDivergent
        expr: voltage_fleet_agreement{check="policy"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Fleet {{ $labels.fleet }}: members serve different policy configuration"
          description: "Formats, auth methods, key tables or version differ between members ({{ with printf `voltage_fleet_member_diverged{fleet=\"%s\",check=\"policy\"} == 1` $labels.fleet | query }}{{ range . }}{{ .Labels.target }} {{ end }}{{ end }}are the odd ones). Policy propagates lazily and per node, so a few minutes after a change is normal -- 10 minutes is not. Clients on different members are now enforcing different policy."

      - alert: VoltageFleetKeyTableSkew
        expr: voltage_fleet_agreement{check="key_table"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Fleet {{ $labels.fleet }}: key table {{ $labels.key }} is at different currentNumber on different members"
          description: "A rotation reached some members and not others. eFPE ciphertext produced on the rotated side embeds a key number the others do not have yet. Finish the rotation everywhere or roll it back; do not fail over in between."

      - alert: VoltageFleetVersionSkew
        expr: voltage_fleet_agreement{check="version"} == 0
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Fleet {{ $labels.fleet }}: members run different appliance versions"
          description: "Fine during a rolling upgrade; not fine as a steady state. SST3 (CE 24.4) in particular changes the tokenization engine."

  # Coverage: classified sensitive columns x data map x live policy (R6, R7).
  - name: voltage-coverage
    rules:
      - alert: VoltageUnprotectedSensitiveColumn
        expr: sum by (classification) (voltage_coverage_columns{state="unmapped"}) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} column(s) classified {{ $labels.classification }} have no protection mapping"
          description: "Discovery says these columns hold {{ $labels.classification }}; the data map has no entry for them, so nothing tokenizes them and no identity is authorised to. PCI scope drift, caught in Prometheus rather than in next year's ROC. Named in voltage_coverage_column_info{state=\"unmapped\"}. Either map them (voltage-data-map.yml) or dispute the classification -- do not leave them."

      - alert: VoltageBrokenProtectionMapping
        expr: sum by (classification) (voltage_coverage_columns{state="broken"}) > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} column(s) classified {{ $labels.classification }} are mapped to protection that no longer holds"
          description: "The data map says these columns are protected, but the format is no longer offered by the district, the identity is not declared, or it is not allowed that format. The application believes it is tokenizing; the appliance will refuse or a different identity is doing it. See voltage_coverage_column_info{state=\"broken\"} for the reason per column."

      - alert: VoltageDeadFormat
        expr: voltage_coverage_dead_format == 1
        for: 24h
        labels: {severity: info}
        annotations:
          summary: "Format {{ $labels.format }} in district {{ $labels.district }} is offered but nothing uses it"
          description: "No data-map column and no declared identity references it. Its keys still rotate and it is still an authorisable capability. Retire it, or map what uses it."

      - alert: VoltageClassificationFeedStale
        expr: voltage:coverage_feed_age_days > 7
        labels: {severity: warning}
        annotations:
          summary: "The classification feed is {{ $value | printf \"%.0f\" }} days old"
          description: "Coverage is only as current as discovery. A feed nobody refreshes reports the world as it was, not as it is."

      - alert: VoltageCoverageInputsUnreadable
        expr: voltage_coverage_up == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Coverage inputs (classification feed / data map) cannot be read"
          description: "voltage_coverage_up is 0: a file is missing, unreadable or not valid YAML/CSV. Coverage metrics are stale until fixed; check exporter logs."

  # Structured Data Manager: masked data and batch jobs (R8, R9). docs/SDM.md
  - name: voltage-sdm
    rules:
      - alert: SDMMaskLeak
        expr: voltage_sdm_mask_ok{kind="leak"} == 0
        labels: {severity: critical}
        annotations:
          summary: "MASKING LEAK: {{ with printf `voltage_sdm_mask_hits{check=\"%s\",kind=\"leak\"}` $labels.check | query }}{{ . | first | value }}{{ end }} live-looking value(s) in masked data ({{ $labels.check }})"
          description: "A planted canary (or, if the heuristic is on, a live-looking value) is present in the masked copy. The masking job skipped rows, ran against the wrong source, or a refresh copied production over it. Non-production now holds production data: treat as an incident, and do not hand this environment to developers until it is re-masked."

      - alert: SDMMaskInconsistent
        expr: voltage_sdm_mask_ok{kind="consistency"} == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.check }}: the same source key masks to different values across tables"
          description: "Referential integrity broke in the masked environment: joins on this column silently drop rows and test results lie. Usually two tables masked by different jobs, formats or key epochs. Re-mask them together."

      - alert: SDMMaskConstant
        expr: voltage_sdm_mask_ok{kind="constant"} == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.check }}: every masked value is identical"
          description: "A fill-with-X job that 'worked'. The column is useless for testing and any code path that branches on it is untested."

      - alert: SDMJobStale
        expr: voltage_sdm_job_stale == 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "SDM job {{ $labels.job }} has not succeeded within its expected interval"
          description: "Last success {{ with printf `voltage:sdm_job_hours_since_success{check=\"%s\",job=\"%s\"}` $labels.check $labels.job | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }} hours ago. Archive, retention and masking runs fail quietly; the first symptom is otherwise a storage bill or a retention violation."

      - alert: SDMJobFailing
        expr: voltage_sdm_job_failing == 1
        labels: {severity: warning}
        annotations:
          summary: "SDM job {{ $labels.job }}: most recent run failed"
          description: "Check the job's own log. If it is the masking refresh, the masked environment may be partial -- see SDMMaskLeak / SDMMaskInconsistent."

      - alert: SDMSourceUnreadable
        expr: voltage_sdm_check_up == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "SDM check {{ $labels.check }} ({{ $labels.kind }}) cannot read its source"
          description: "Database unreachable, credentials rejected, query invalid, or export file missing. The check's other metrics are stale until fixed; see exporter logs."

  - name: voltage-identity-activity
    rules:
      # R10a -- what the appliance can see: authentication and key issuance per identity.
      # docs/VISIBILITY.md explains why per-transaction protect/access counts are NOT here.
      - alert: VoltageIdentityActivitySpike
        expr: voltage_identity_activity_spike{event="key_request"} == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.identity }}: key requests {{ with printf `voltage_identity_events{identity=\"%s\",event=\"key_request\"}` $labels.identity | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }} this window vs baseline {{ with printf `voltage_identity_events_baseline{identity=\"%s\",event=\"key_request\"}` $labels.identity | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }}"
          description: "A step change in key issuance for one identity: a new batch job, a client restart storm, a rotated secret being retried, or someone pulling keys for every format at once. Key issuance is the control-plane edge of bulk detokenization -- the appliance cannot see cached client-side access() calls, but it sees this. Match it to a change or a job schedule; if neither, treat as a potential exfiltration precursor."

      - alert: VoltageIdentityAuthFailures
        expr: voltage_identity_events{event="auth_fail"} >= 10
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.identity }}: {{ $value | printf \"%.0f\" }} authentication failures this window"
          description: "Repeated failed authentication for one identity. Benign cause: a secret rotated and one client was not updated. Malicious cause: credential guessing against a service identity. Either way the client host in the audit export names the source."

      - alert: VoltageNewIdentityActive
        expr: voltage_identity_new == 1
        labels: {severity: info}
        annotations:
          summary: "New identity active: {{ $labels.identity }}"
          description: "Seen for the first time in the baseline period. Expected after onboarding an application; otherwise ask who created it -- new identities are a Management Console admin action and appear in its audit log."

      - alert: VoltageUndeclaredIdentity
        expr: voltage_identity_undeclared == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Identity active but not declared: {{ $labels.identity }}"
          description: "Using keys, but absent from declared_identities (the desired-state document). Either the rulebook is behind reality -- fix the config-as-code -- or something is authenticating that nobody approved. The Ansible audit role reports the same drift from the other side."

      - alert: VoltageIdentityAuditStale
        expr: voltage_identity_audit_age_seconds > 2 * voltage_identity_activity_window_seconds
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Appliance audit export is stale ({{ $value | humanizeDuration }} since the newest event)"
          description: "No new audit events for two windows. Either every identity went quiet (unlikely with an exporter probing) or the export/forwarding stopped -- in which case the identity alerts above are blind."

      - alert: VoltageIdentityAuditUnreadable
        expr: voltage_identity_activity_up == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Identity activity: audit export cannot be read"
          description: "Database unreachable, credentials rejected, query invalid, or export file missing. See exporter logs."

  - name: voltage-root-of-trust
    rules:
      # R11 -- the identity / master-secret backup is the whole root of trust; prove it restores.
      - alert: VoltageRestoreDrillNeverTested
        expr: voltage_restore_drill_overdue == 1 unless voltage_identity_backup_restore_tested_timestamp_seconds
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Restore drill {{ $labels.drill }} ({{ $labels.district }}) has never succeeded"
          description: "No successful tested restore of the identity backup on record. Stateless key management has no token vault to fall back on: an unrestorable identity backup means every token ever issued in this district is unrecoverable. Schedule the drill (docs/ROOT-OF-TRUST.md)."

      - alert: VoltageRestoreDrillOverdue
        expr: voltage_restore_drill_overdue == 1 and voltage:restore_drill_days_since_success > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Restore drill {{ $labels.drill }} ({{ $labels.district }}) overdue: last success {{ with printf `voltage:restore_drill_days_since_success{drill=\"%s\",district=\"%s\"}` $labels.drill $labels.district | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }} days ago"
          description: "Older than max_age. The backup may still be good; nobody has proved it recently, and the appliance version, HSM firmware or Security World may have changed since. Run the drill."

      - alert: VoltageRestoreDrillFailed
        expr: voltage_restore_drill_last_failed == 1
        labels: {severity: critical}
        annotations:
          summary: "Restore drill {{ $labels.drill }} ({{ $labels.district }}): most recent attempt FAILED"
          description: "The identity backup did not restore cleanly. Until it does, assume the district cannot be rebuilt after an HSM or appliance loss. Two public restore defects exist in the community wiki; check the version-specific notes before retrying."

      - alert: VoltageRestoreDrillEvidenceUnreadable
        expr: voltage_restore_drill_up == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Restore drill {{ $labels.drill }}: evidence source cannot be read"
          description: "The drill may have run; the exporter cannot see it. Fix the source before the freshness alert is trusted either way."
