global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: voltage-exporter
    static_configs:
      - targets: ["voltage-exporter:9743"]
  # Root of trust (roadmap R11): the HSM that anchors the district master secret, monitored by the
  # sister project luna-exporter (github.com/FlavioImbertDomingos/luna-exporter). The Grafana row
  # "Root of trust" reads luna_up, luna_hsm_info, luna_hsm_tamper_events, luna_hsm_fips_mode_enabled
  # and shows "No data" until this job exists.
  # - job_name: luna-exporter
  #   static_configs:
  #     - targets: ["luna-exporter:9744"]

