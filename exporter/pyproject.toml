[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltage-exporter"
version = "0.1.0"
description = "Synthetic-probe Prometheus exporter for OpenText Voltage SecureData: tokenization latency, error rate, policy drift, certificate expiry"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Flavio Domingos" }]
keywords = ["prometheus", "exporter", "voltage", "securedata", "tokenization", "fpe", "monitoring"]
dependencies = [
  "prometheus-client>=0.20",
  "requests>=2.31",
  "PyYAML>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "responses>=0.25", "flask>=3.0"]

[project.scripts]
voltage-exporter = "voltage_exporter.__main__:main"

[tool.setuptools.packages.find]
include = ["voltage_exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
