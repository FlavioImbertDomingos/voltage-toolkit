# Scheduled searches Splunk raises on its own -- for the cases where the alert should come from
# the SIEM's long memory rather than from Prometheus's short one.

[Voltage - policy changed outside a change window]
search = `voltage_probe_events` earliest=-24h | streamstats current=f last(policy_sha256) AS prev BY target | where isnotnull(prev) AND policy_sha256!=prev | eval hour=tonumber(strftime(_time,"%H")), dow=strftime(_time,"%a") | where NOT (dow="Sat" OR dow="Sun") AND (hour<20 OR hour>23) | table _time target prev policy_sha256 server_version
cron_schedule = */15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
enableSched = 1
alert.severity = 4
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
description = A clientPolicy.xml hash changed on a weekday outside 20:00-23:59 UTC. PCI DSS change control: match it to a ticket.

[Voltage - exporter went silent]
search = `voltage_probe_events` earliest=-30m | stats latest(_time) AS last BY target | eval minutes=round((now()-last)/60) | where minutes > 5
cron_schedule = */5 * * * *
dispatch.earliest_time = -30m
dispatch.latest_time = now
enableSched = 1
alert.severity = 3
alert.track = 1
counttype = number of events
relation = greater than
quantity = 0
description = No probe event for a target in 5 minutes. Prometheus cannot tell you this if the exporter host is what died; Splunk can.

[Voltage - masking leak time to clear]
search = `voltage_alerts` alertname=SDMMaskLeak status=resolved earliest=-7d | eval minutes=round((ended-started)/60) | stats count AS incidents avg(minutes) AS avg_minutes max(minutes) AS max_minutes BY target
cron_schedule = 0 7 * * 1
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 1
alert.track = 0
description = Weekly: how long masked non-prod held production-looking data before it was re-masked. The number an assessor asks for.
