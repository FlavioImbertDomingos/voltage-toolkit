# Change the index once, here.
[voltage_index]
definition = index=security
iseval = 0

[voltage_probe_events]
definition = `voltage_index` sourcetype=voltage-exporter event=probe
iseval = 0

# One row per (event, probe): explode probes[] so format / ok / latency / error_kind are fields.
[voltage_probes_expanded]
definition = `voltage_probe_events` | spath path=probes{} output=probe | mvexpand probe | spath input=probe
iseval = 0

# One row per alert inside each Alertmanager notification.
[voltage_alerts]
definition = `voltage_index` sourcetype=alertmanager | spath path=alerts{} output=alert | mvexpand alert | spath input=alert | rename labels.alertname AS alertname, labels.severity AS severity, labels.target AS target, labels.format AS format, annotations.summary AS summary | eval started=strptime(substr(startsAt,1,19),"%Y-%m-%dT%H:%M:%S"), ended=if(status="resolved", strptime(substr(endsAt,1,19),"%Y-%m-%dT%H:%M:%S"), null())
iseval = 0
