# voltage-exporter with `log_format: json`, shipped as raw lines (Docker splunk driver
# `splunk-format: raw`, a Universal Forwarder, or an OTel filelog receiver).
[voltage-exporter]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 0

# Alertmanager webhook payloads posted to /services/collector/raw?sourcetype=alertmanager.
# One POST = one event holding the whole alert group (alerts[]); never split or truncate it.
[alertmanager]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
DATETIME_CONFIG = CURRENT
TRUNCATE = 0
