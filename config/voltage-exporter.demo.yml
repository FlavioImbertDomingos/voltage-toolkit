# Demo config: points at the mock appliance in docker-compose.
exporter:
  port: 9743
  interval_seconds: 15

# Structured Data Manager: masked data quality and batch jobs (see docs/SDM.md).
# The non-prod database is seeded by the nonprod-seed service in docker-compose.
sdm:
  masking:
    - name: nonprod-pan-leak
      kind: leak
      source: {type: sql, dsn: "sqlite:////data/nonprod.db"}
      query: "SELECT pan FROM customers"
      canary_file: /config/canaries.txt
    - name: nonprod-pan-ri
      kind: consistency
      source: {type: sql, dsn: "sqlite:////data/nonprod.db"}
      query: "SELECT c.customer_id, c.pan, o.pan FROM customers c JOIN orders o USING (customer_id)"
    - name: nonprod-ssn-constant
      kind: constant
      source: {type: sql, dsn: "sqlite:////data/nonprod.db"}
      query: "SELECT ssn FROM customers"
  jobs:
    - name: sdm
      source: {type: sql, dsn: "sqlite:////data/nonprod.db"}
      query: "SELECT job_name, status, finished_at, rows_processed FROM sdm_job_history"
      expect_every: 24h

# Is every classified sensitive column actually protected? (see docs/COVERAGE.md)
# R10a: what the appliance can see -- authentication and key issuance per identity, from an
# audit export. The demo reads a seeded table; a real deployment points at the Management
# Console's audit database or a syslog sink. Baseline = median of the previous 24 windows.
identity_activity:
  source: {type: sql, dsn: sqlite:////data/nonprod.db}
  query: SELECT ts, identity, event FROM voltage_audit
  window: 1h
  baseline_windows: 24
  spike_ratio: 5
  min_events: 20
  auth_fail_threshold: 10
  declared_identities: [payments@demo.bank, batch-etl@demo.bank, probe@demo.bank]

# R11: the identity / master-secret backup, proven restorable. Evidence rows come from wherever
# the drill records them; prod was proven 12 days ago, DR's last attempt failed.
restore_drills:
  - name: prod-identity-backup
    district: prod
    max_age: 90d
    source: {type: sql, dsn: sqlite:////data/nonprod.db}
    query: SELECT drill, finished_at, result FROM restore_drills
  - name: dr-identity-backup
    district: dr
    max_age: 90d
    source: {type: sql, dsn: sqlite:////data/nonprod.db}
    query: SELECT drill, finished_at, result FROM restore_drills

coverage:
  classification_csv: /config/classification.csv
  data_map: /config/voltage-data-map.yml
  min_confidence: 0.8

targets:
  - name: demo-prod
    policy_url: https://voltage:8443/policy/clientPolicy.xml
    ws_url: https://voltage:8443
    console_url: https://voltage:8443/console/   # Management Console: control plane, one active instance
    api: rest
    identity: probe@demo.bank
    auth:
      method: shared_secret
      secret_env: VOLTAGE_SHARED_SECRET
    verify_tls: false            # self-signed mock cert; use ca_cert in real life
    timeout_seconds: 5
    probes:
      - {format: CC,        sample: "4111111111111111"}
      - {format: SSN,       sample: "123-45-6789"}
      - {format: AlphaNumeric, sample: "Order7781X"}
      - {format: CC-ST-64O, sample: "5500000000000004", tokenization: true}
    labels: {site: demo}
    fleet: demo                  # must agree with demo-dr: policy, key tables, tokens

  # The same district in a second region. Must give the same answers as demo-prod.
  - name: demo-dr
    policy_url: https://voltage-dr:8443/policy/clientPolicy.xml
    ws_url: https://voltage-dr:8443
    api: rest
    identity: probe@demo.bank
    auth:
      method: shared_secret
      secret_env: VOLTAGE_SHARED_SECRET
    verify_tls: false
    timeout_seconds: 5
    probes:
      - {format: CC,        sample: "4111111111111111"}
      - {format: SSN,       sample: "123-45-6789"}
      - {format: AlphaNumeric, sample: "Order7781X"}
      - {format: CC-ST-64O, sample: "5500000000000004", tokenization: true}
    labels: {site: demo-dr}
    fleet: demo

  # The same appliance over SOAP, so both code paths stay honest.
  - name: demo-prod-soap
    policy_url: https://voltage:8443/policy/clientPolicy.xml
    ws_url: https://voltage:8443
    api: soap
    identity: monitor
    auth:
      method: password
      username: monitor
      secret_env: VOLTAGE_PASSWORD
    verify_tls: false
    probes:
      - {format: CC, sample: "4242424242424242"}
