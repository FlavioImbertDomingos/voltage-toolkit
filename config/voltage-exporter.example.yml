# voltage-exporter configuration -- copy to config/voltage-exporter.yml.
# Secrets come from env vars (`secret_env`) or files (`secret_file`), never inline.

exporter:
  port: 9743
  interval_seconds: 30       # every probe runs this often; each tokenize probe = 2 WS calls

# Optional: Structured Data Manager checks -- masked non-prod data and job history. See docs/SDM.md.
# sdm:
#   masking:
#     - name: nonprod-cards-pan
#       kind: leak                                   # leak | consistency | constant
#       source: {type: sql, driver: psycopg, dsn: "postgresql://ro@nonprod-db/cards", password_env: NONPROD_DB_PASSWORD}
#       query: "SELECT pan FROM customers"
#       canary_file: /etc/voltage-exporter/canaries.sha256
#       canaries_hashed: true
#   jobs:
#     - name: sdm
#       source: {type: file, path: /exports/sdm-jobs.csv}
#       columns: [job_name, status, finished_at, rows]
#       expect_every: 24h

# Optional: join a classification feed (from SDM, Core Data Discovery, or a spreadsheet)
# with your data map and the live policy. See docs/COVERAGE.md.
# coverage:
#   classification_csv: /etc/voltage-exporter/classification.csv
#   data_map: /etc/voltage-exporter/voltage-data-map.yml
#   desired_state: /etc/voltage-exporter/voltage-config.yml   # enables identity checks
#   min_confidence: 0.8
#   sensitive_classes: [PAN, SSN, CVV]

targets:
  - name: prod
    policy_url: https://voltage-pp-0000.example.com/policy/clientPolicy.xml
    ws_url: https://voltage-pp-0000.example.com      # host serving /vibesimple/...
    api: rest                                        # rest | soap
    identity: monitor-probe@example.com              # a dedicated, low-privilege probe identity
    auth:
      method: shared_secret                          # shared_secret | password
      secret_env: VOLTAGE_SHARED_SECRET_PROD
    ca_cert: /config/corp-ca.pem                     # or verify_tls: true/false
    timeout_seconds: 10
    probes:
      # Use SYNTHETIC samples only (test PANs etc.). Never real data.
      - {format: CC,  sample: "4111111111111111"}
      - {format: SSN, sample: "123-45-6789"}
      - {format: CC-ST-64O, sample: "4111111111111111", tokenization: true}
    extra_tls_hosts:
      - voltage-ks-0000.example.com:443
      - voltage-mgmt.example.com:8443
    labels: {site: phx-dc1}
    fleet: prod                  # targets with the same fleet name must agree (policy, key numbers, tokens)
    # Silent-corruption checks (all on by default). Determinism is skipped for eFPE formats.
    # isolation_pairs overrides the default "each FPE probe against the next one".
    integrity:
      determinism: true
      double_protect: true
      format_isolation: true
      # isolation_pairs: [[CC, SSN]]

