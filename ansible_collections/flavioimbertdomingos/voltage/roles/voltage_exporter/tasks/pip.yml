---
- name: Service user
  ansible.builtin.user:
    name: "{{ voltage_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Virtualenv + package
  ansible.builtin.pip:
    name: "{{ voltage_exporter_pip_spec }}"
    virtualenv: "{{ voltage_exporter_venv }}"
    virtualenv_command: "python3 -m venv"
  notify: Restart voltage-exporter

- name: systemd unit
  ansible.builtin.template:
    src: voltage-exporter.service.j2
    dest: /etc/systemd/system/voltage-exporter.service
    mode: "0644"
  notify: Restart voltage-exporter

- name: Enable + start
  ansible.builtin.systemd:
    name: voltage-exporter
    enabled: true
    state: started
    daemon_reload: true
